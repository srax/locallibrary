{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - {% trans "Page Not Found" %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            text-align: center;
            padding: 20px;
        }
        .error-content {
            max-width: 600px;
        }
        .pixel-art {
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            line-height: 1.2;
            color: var(--primary-color);
            margin-bottom: 2rem;
            white-space: pre;
            font-weight: bold;
        }
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            line-height: 1;
            margin-bottom: 1rem;
            color: var(--primary-color);
            text-shadow:
                4px 4px 0 rgba(13, 110, 253, 0.2);
            letter-spacing: 0.5rem;
        }
        .error-message {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 600;
            color: var(--text-color);
            font-family: 'Courier New', monospace;
        }
        .error-description {
            font-size: 1rem;
            margin-bottom: 2rem;
            color: var(--text-muted);
            line-height: 1.6;
        }
        .btn-home {
            background: var(--primary-color);
            color: white;
            padding: 12px 30px;
            border-radius: 0;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            transition: none;
            border: 3px solid var(--primary-color);
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 5px 5px 0 rgba(13, 110, 253, 0.2);
        }
        .btn-home:hover {
            background: white;
            color: var(--primary-color);
            transform: translate(2px, 2px);
            box-shadow: 3px 3px 0 rgba(13, 110, 253, 0.2);
        }
        .error-links {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 3px dashed var(--border-color);
        }
        .error-links a {
            color: var(--primary-color);
            text-decoration: none;
            margin: 0 1rem;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            transition: none;
        }
        .error-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <div class="pixel-art">    ___
   |_  |
     | |
     |_|
     (_)</div>
            <div class="error-code">404</div>
            <div class="error-message">{% trans "PAGE NOT FOUND" %}</div>
            <div class="error-description">
                {% trans "Oops! The page you're looking for doesn't exist." %}
            </div>
            <a href="/" class="btn-home">{% trans "Home" %}</a>
            <div class="error-links">
                <a href="/catalog/categories/">{% trans "Categories" %}</a>
                <span style="color: var(--border-color);">|</span>
                <a href="/catalog/threads/">{% trans "Threads" %}</a>
            </div>
        </div>
    </div>
</body>
</html>
