{% extends "base_generic.html" %}

{% block content %}
  <h1>Delete Post</h1>

  <div class="alert alert-warning">
    <p><strong>Are you sure you want to delete this post?</strong></p>
    <p>This action cannot be undone.</p>
  </div>

  <div class="card mb-3">
    <div class="card-header">
      <strong>Thread:</strong> {{ post.thread.title }}
    </div>
    <div class="card-body">
      <p>{{ post.content }}</p>
      <small class="text-muted">Posted on {{ post.created_date|date:"M d, Y H:i" }}</small>
    </div>
  </div>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete Post</button>
    <a href="{% url 'my-posts' %}" class="btn btn-secondary">Cancel</a>
  </form>

{% endblock %}
