{% extends "base_generic.html" %}
{% load i18n %}

{% block content %}
  <h1>{% trans "Create New Thread" %}</h1>

  <form action="" method="post">
    {% csrf_token %}
    <table>
    {{ form.as_table }}
    </table>
    <input type="submit" value="{% trans 'Create Thread' %}" class="btn btn-primary">
    <a href="{% url 'threads' %}" class="btn btn-secondary">{% trans "Cancel" %}</a>
  </form>
{% endblock %}
